name: Publicar no Instagram
on:
  schedule:
    - cron: "7 * * * *"   # de hora em hora (UTC); o horário do post vem do nome da pasta
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-escrita
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publicar posts vencidos
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publicar.py
      - name: Mover para publicados
        if: always()
        run: |
          git config user.name "robo-insta"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fila publicados
          git diff --cached --quiet || (git commit -m "Posts publicados" && git pull --rebase && git push)
