name: Gerar artes
on:
  push:
    paths: ["fila/**", "marca/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-escrita
jobs:
  arte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Baixar fonte Playfair Display (se não houver)
        run: |
          [ -f marca/fonte.ttf ] || curl -sSL -o marca/fonte.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
      - run: python scripts/gerar_artes.py
      - name: Salvar artes
        run: |
          git config user.name "robo-arte"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fila
          git diff --cached --quiet || (git commit -m "Artes geradas" && git pull --rebase && git push)
