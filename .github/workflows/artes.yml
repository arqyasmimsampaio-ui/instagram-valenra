name: Gerar artes
on:
  push:
    paths: ["fila/**", "marca/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-escrita
jobs:
  arte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Gerar fotos com modelo IA (pastas com pedido.txt)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
        run: python scripts/gerar_modelo.py
      - name: Baixar fonte Playfair Display (se não houver)
        run: |
          [ -f marca/fonte.ttf ] || curl -sSL -o marca/fonte.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
      - run: python scripts/gerar_artes.py
      - name: Fontes das capas de reels (se não houver)
        run: |
          mkdir -p fonts
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          [ -f fonts/Playfair.ttf ] || curl -sSL -o fonts/Playfair.ttf "$G/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          [ -f fonts/PlayfairItalic.ttf ] || curl -sSL -o fonts/PlayfairItalic.ttf "$G/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf"
          [ -f fonts/Jost.ttf ] || curl -sSL -o fonts/Jost.ttf "$G/jost/Jost%5Bwght%5D.ttf"
      - name: Gerar capas de reels (pastas com video + capa.txt)
        run: VALENRA_FONTES=fonts python scripts/capa_reels.py --fila
      - name: Salvar artes
        run: |
          git config user.name "robo-arte"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fila
          git diff --cached --quiet || (git commit -m "Artes geradas" && git pull --rebase && git push)
