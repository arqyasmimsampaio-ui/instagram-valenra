name: Renovar token do Instagram
on:
  schedule:
    - cron: "17 13 1,20 * *"   # dias 1 e 20 de cada mês
  workflow_dispatch:
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar token (vale +60 dias)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RESP=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN")
          NOVO=$(echo "$RESP" | jq -r '.access_token // empty')
          if [ -z "$NOVO" ]; then
            echo "Falha ao renovar: $(echo "$RESP" | jq -c '.error // .')"
            exit 1
          fi
          echo "::add-mask::$NOVO"
          echo "Token renovado. Validade: $(echo "$RESP" | jq -r '.expires_in') segundos."
          if [ -n "$GH_TOKEN" ] && [ "$NOVO" != "$IG_ACCESS_TOKEN" ]; then
            gh secret set IG_ACCESS_TOKEN --body "$NOVO" --repo "$GITHUB_REPOSITORY"
            echo "Secret IG_ACCESS_TOKEN atualizado."
          fi
